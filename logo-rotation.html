<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logo Rotation Demo</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 20px;
      padding: 60px 40px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      text-align: center;
      max-width: 500px;
      width: 100%;
    }

    h1 {
      font-size: 28px;
      color: #1a1a1a;
      margin-bottom: 10px;
      font-weight: 600;
    }

    .subtitle {
      font-size: 14px;
      color: #888;
      margin-bottom: 40px;
      letter-spacing: 0.5px;
    }

    .logo-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 40px;
      perspective: 1000px;
      height: 200px;
    }

    #logo {
      height: auto;
      max-width: 200px;
      width: 100%;
      transition: transform 1s linear;
      transform-style: preserve-3d;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      will-change: transform;
    }

    #logo.rotate {
      transform: rotateY(180deg);
    }

    .info-box {
      background: #f5f5f5;
      border-left: 4px solid #667eea;
      padding: 20px;
      border-radius: 8px;
      text-align: left;
      margin-bottom: 30px;
    }

    .info-box h3 {
      font-size: 14px;
      color: #1a1a1a;
      margin-bottom: 8px;
      font-weight: 600;
    }

    .info-box p {
      font-size: 12px;
      color: #666;
      line-height: 1.6;
    }

    .button-group {
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    button {
      padding: 12px 28px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: 'Poppins', sans-serif;
    }

    .btn-primary {
      background: #667eea;
      color: white;
    }

    .btn-primary:hover {
      background: #5568d3;
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
    }

    .btn-secondary {
      background: #f0f0f0;
      color: #1a1a1a;
      border: 1px solid #ddd;
    }

    .btn-secondary:hover {
      background: #e8e8e8;
      transform: translateY(-2px);
    }

    .status {
      font-size: 12px;
      color: #888;
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid #eee;
    }

    .status.active {
      color: #667eea;
      font-weight: 600;
    }

    @media (max-width: 600px) {
      .container {
        padding: 40px 20px;
      }

      h1 {
        font-size: 24px;
      }

      .logo-wrapper {
        height: 150px;
      }

      #logo {
        max-width: 150px;
      }

      .button-group {
        flex-direction: column;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Logo Rotation Demo</h1>
    <p class="subtitle">Watch the logo flip and change</p>

    <div class="logo-wrapper">
      <img id="logo" src="images/ESEFF REAL ESTATE LOGO (3).png" alt="Logo">
    </div>

    <div class="info-box">
      <h3>How it works:</h3>
      <p>The logo rotates 180 degrees on the Y-axis, then switches to the second logo image and completes the rotation. This creates a smooth flip effect.</p>
    </div>

    <div class="button-group">
      <button class="btn-primary" onclick="triggerLogoRotation()">Start Rotation</button>
      <button class="btn-secondary" onclick="resetLogo()">Reset</button>
    </div>

    <div class="status" id="status">Ready to rotate</div>
  </div>

  <script>
    // ==================== LOGO ROTATION ====================
    function initializeLogoRotation() {
      const logo = document.getElementById("logo");
      if (!logo) return;

      const firstLogo = new Image();
      const secondLogo = new Image();
      firstLogo.src = "images/ESEFF REAL ESTATE LOGO (3).png";
      secondLogo.src = "images/ESEFF REAL ESTATE LOGO (6).png";

      Promise.all([
        new Promise((res) => (firstLogo.onload = res)),
        new Promise((res) => (secondLogo.onload = res)),
      ]).then(() => {
        setTimeout(() => {
          triggerLogoRotation();
        }, 1500);
      });
    }

    function triggerLogoRotation() {
      const logo = document.getElementById("logo");
      const status = document.getElementById("status");

      if (!logo) return;

      status.textContent = "Rotating...";
      status.classList.add("active");

      logo.classList.add("rotate");

      setTimeout(() => {
        logo.src = "images/ESEFF REAL ESTATE LOGO (6).png";
        logo.classList.remove("rotate");
        logo.style.transform = "rotateY(360deg)";

        setTimeout(() => {
          status.textContent = "Rotation complete!";
          status.classList.add("active");

          setTimeout(() => {
            status.textContent = "Ready to rotate";
            status.classList.remove("active");
          }, 2000);
        }, 750);
      }, 750);
    }

    function resetLogo() {
      const logo = document.getElementById("logo");
      const status = document.getElementById("status");

      if (!logo) return;

      logo.classList.remove("rotate");
      logo.style.transform = "rotateY(0deg)";
      logo.src = "images/ESEFF REAL ESTATE LOGO (3).png";
      status.textContent = "Reset complete";
      status.classList.remove("active");

      setTimeout(() => {
        status.textContent = "Ready to rotate";
      }, 1500);
    }

    // Initialize on page load
    window.addEventListener("load", () => {
      initializeLogoRotation();
    });
  </script>
</body>
</html>
